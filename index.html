<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>HHHUUUBBB</title>
  <meta name="description" content="HHHUUUBBB — VAMRSS web application hub.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --line: rgba(17, 23, 20, .15);
      --hover: rgba(17, 23, 20, .035);
      --invert-bg: #111714;
      --invert-ink: #f8f9f9;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
      --line: rgba(237, 241, 239, .15);
      --hover: rgba(237, 241, 239, .04);
      --invert-bg: #edf1ef;
      --invert-ink: #101312;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: .01em;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a { color: inherit; }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: calc(max(14px, env(safe-area-inset-top)) + 14px) 18px max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: .16em;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .text-btn {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--sub);
      font-size: 10px;
      line-height: 1;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .text-btn:hover,
    .text-btn:focus-visible {
      color: var(--ink);
    }

    .search {
      width: 118px;
      height: 22px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: transparent;
      padding: 0 2px;
      color: var(--ink);
      font-size: 10px;
      font-weight: 300;
    }

    .search::placeholder { color: var(--muted); }

    .section-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: var(--sub);
      font-size: 9px;
      line-height: 1;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .table {
      width: 100%;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(120px, 1.1fr) minmax(180px, 2fr) auto;
      min-height: 34px;
      border-top: 1px solid var(--line);
      align-items: stretch;
    }

    .row:first-child { border-top: 0; }

    .row.header {
      min-height: 24px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .row.item:hover { background: var(--hover); }

    .cell {
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 6px 8px;
    }

    .cell:first-child { padding-left: 0; }
    .cell:last-child { padding-right: 0; }

    .name {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .055em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .description {
      color: var(--sub);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      white-space: nowrap;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      min-width: 42px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 0 7px;
      color: var(--sub);
      font-size: 9px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: .07em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .action:hover,
    .action:focus-visible {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--bg);
      outline: none;
    }

    .empty {
      display: none;
      padding: 14px 0;
      color: var(--muted);
      font-size: 10px;
    }

    .empty.show { display: block; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
      letter-spacing: .06em;
    }

    .download-status {
      min-height: 1em;
      text-align: right;
    }

    @media (max-width: 560px) {
      .app { padding-left: 14px; padding-right: 14px; }
      .topbar { margin-bottom: 16px; }
      .search { width: 86px; }
      .row { grid-template-columns: minmax(0, 1fr) auto; }
      .row .cell:nth-child(2) { display: none; }
      .row.header .cell:nth-child(3) { justify-content: flex-end; }
      .cell { padding-top: 5px; padding-bottom: 5px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand">HHHUUUBBB</h1>
      <div class="controls">
        <input id="searchInput" class="search" type="search" placeholder="SEARCH" autocomplete="off" aria-label="Search applications">
        <button id="themeButton" class="text-btn" type="button" aria-label="Toggle theme">DARK</button>
      </div>
    </header>

    <div class="section-line">
      <span>WEB APPLICATIONS</span>
      <span id="countLabel">01</span>
    </div>

    <section class="table" aria-label="Web applications">
      <div class="row header" aria-hidden="true">
        <div class="cell">APP</div>
        <div class="cell">DESCRIPTION</div>
        <div class="cell">ACTION</div>
      </div>
      <div id="appRows"></div>
    </section>

    <div id="emptyState" class="empty">NO MATCHING APPLICATIONS</div>

    <footer class="footer">
      <span>VAMRSS</span>
      <span id="downloadStatus" class="download-status"></span>
    </footer>
  </main>

  <script>
    const APPS = [
      {
        name: 'MEMOTIMER',
        description: 'Memo / hidden countdown timer',
        openUrl: 'https://vamrss.github.io/memotimer/',
        htmlUrl: 'https://raw.githubusercontent.com/VAMRSS/memotimer/main/index.html',
        fileName: 'memotimer.html'
      }
    ];

    const root = document.documentElement;
    const themeButton = document.getElementById('themeButton');
    const searchInput = document.getElementById('searchInput');
    const appRows = document.getElementById('appRows');
    const emptyState = document.getElementById('emptyState');
    const countLabel = document.getElementById('countLabel');
    const downloadStatus = document.getElementById('downloadStatus');

    function padCount(value) {
      return String(value).padStart(2, '0');
    }

    function setTheme(theme) {
      root.dataset.theme = theme;
      themeButton.textContent = theme === 'dark' ? 'LIGHT' : 'DARK';
      localStorage.setItem('hhhuuubbb-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#101312' : '#f8f9f9'
      );
    }

    const savedTheme = localStorage.getItem('hhhuuubbb-theme');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemDark ? 'dark' : 'light'));

    themeButton.addEventListener('click', () => {
      setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    function createRow(app) {
      const row = document.createElement('div');
      row.className = 'row item';
      row.dataset.search = `${app.name} ${app.description}`.toLowerCase();

      const nameCell = document.createElement('div');
      nameCell.className = 'cell name';
      nameCell.textContent = app.name;

      const descriptionCell = document.createElement('div');
      descriptionCell.className = 'cell description';
      descriptionCell.textContent = app.description;

      const actionCell = document.createElement('div');
      actionCell.className = 'cell actions';

      const open = document.createElement('a');
      open.className = 'action';
      open.href = app.openUrl;
      open.target = '_blank';
      open.rel = 'noopener noreferrer';
      open.textContent = 'OPEN';

      const download = document.createElement('button');
      download.className = 'action';
      download.type = 'button';
      download.textContent = 'HTML';
      download.setAttribute('aria-label', `Download ${app.name} HTML`);
      download.addEventListener('click', () => downloadHtml(app));

      actionCell.append(open, download);
      row.append(nameCell, descriptionCell, actionCell);
      return row;
    }

    function renderApps() {
      appRows.innerHTML = '';
      APPS.forEach(app => appRows.appendChild(createRow(app)));
      applySearch();
    }

    function applySearch() {
      const query = searchInput.value.trim().toLowerCase();
      const rows = [...appRows.querySelectorAll('.item')];
      let visible = 0;

      rows.forEach(row => {
        const show = !query || row.dataset.search.includes(query);
        row.style.display = show ? '' : 'none';
        if (show) visible += 1;
      });

      countLabel.textContent = padCount(visible);
      emptyState.classList.toggle('show', visible === 0);
    }

    async function downloadHtml(app) {
      downloadStatus.textContent = 'DOWNLOADING…';
      try {
        const response = await fetch(app.htmlUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = app.fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        downloadStatus.textContent = 'DOWNLOADED';
      } catch (error) {
        downloadStatus.textContent = 'DOWNLOAD FAILED';
      }

      window.setTimeout(() => {
        downloadStatus.textContent = '';
      }, 1800);
    }

    searchInput.addEventListener('input', applySearch);
    renderApps();
  </script>
</body>
</html>
