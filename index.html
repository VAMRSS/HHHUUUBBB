<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>HHHUUUBBB</title>
  <meta name="description" content="HHHUUUBBB — a compact hub for VAMRSS web applications.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --line: rgba(17, 23, 20, 0.14);
      --soft: rgba(17, 23, 20, 0.045);
      --invert-bg: #111714;
      --invert-ink: #f8f9f9;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
      --line: rgba(237, 241, 239, 0.14);
      --soft: rgba(237, 241, 239, 0.05);
      --invert-bg: #edf1ef;
      --invert-ink: #101312;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a { color: inherit; }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(38px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 54px;
    }

    .brand {
      margin: 0;
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .text-button,
    .nav-link {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0 2px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .text-button:hover,
    .nav-link:hover,
    .text-button:focus-visible,
    .nav-link:focus-visible {
      color: var(--ink);
    }

    .hero {
      margin-bottom: 48px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      max-width: 440px;
      font-size: clamp(28px, 8vw, 46px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .hero-copy {
      max-width: 420px;
      margin: 22px 0 0;
      color: var(--sub);
      line-height: 1.85;
    }

    .tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 12px;
      align-items: end;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .search-label,
    .count {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .search-wrap {
      min-width: 0;
    }

    .search-label {
      display: block;
      margin-bottom: 4px;
    }

    .search {
      display: block;
      width: 100%;
      min-height: 30px;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      padding: 0;
      color: var(--ink);
      font-size: 12px;
      font-weight: 300;
      line-height: 1.5;
    }

    .search::placeholder { color: var(--muted); }

    .app-list {
      border-top: 1px solid transparent;
    }

    .app-card {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) max-content;
      gap: 14px;
      align-items: start;
      padding: 18px 0 19px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: padding-left 160ms ease, background-color 160ms ease;
    }

    .app-card:hover,
    .app-card:focus-visible {
      padding-left: 8px;
      outline: none;
      background: var(--soft);
    }

    .app-index {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .app-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .app-title {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .badge {
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .app-description {
      margin: 0;
      max-width: 330px;
      color: var(--sub);
      font-size: 11px;
      line-height: 1.75;
    }

    .arrow {
      color: var(--sub);
      line-height: 1.4;
      transform: translateY(1px);
      transition: transform 160ms ease, color 160ms ease;
    }

    .app-card:hover .arrow,
    .app-card:focus-visible .arrow {
      color: var(--ink);
      transform: translate(3px, 1px);
    }

    .empty {
      display: none;
      padding: 28px 0;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .empty.visible { display: block; }

    .placeholder {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 14px;
      padding: 18px 0 19px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .placeholder-title {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 300;
      line-height: 1.6;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .placeholder-copy {
      margin: 0;
      font-size: 11px;
      line-height: 1.75;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 48px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .app {
        padding-left: 18px;
        padding-right: 18px;
      }

      .topbar { margin-bottom: 46px; }
      .hero { margin-bottom: 42px; }
      .hero-title { max-width: 360px; }
      .hero-copy { max-width: 330px; }
      .app-card { grid-template-columns: 28px minmax(0, 1fr) max-content; gap: 10px; }
      .placeholder { grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand">HHHUUUBBB</h1>
      <nav class="nav" aria-label="Utility navigation">
        <button class="text-button" id="themeButton" type="button" aria-label="Switch color theme">DARK</button>
        <a class="nav-link" href="https://github.com/VAMRSS/HHHUUUBBB" target="_blank" rel="noreferrer">GITHUB</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Web Application Hub / VAMRSS</p>
      <h2 class="hero-title" id="hero-title">Small tools.<br>One entrance.</h2>
      <p class="hero-copy">
        個別に増えていくWebアプリを、一つの入口から素早く開くためのハブです。
        必要な機能だけを、必要なときに。
      </p>
    </section>

    <section aria-labelledby="apps-heading">
      <div class="tools">
        <div class="search-wrap">
          <label class="search-label" for="searchInput" id="apps-heading">Applications</label>
          <input class="search" id="searchInput" type="search" placeholder="Search applications" autocomplete="off" spellcheck="false">
        </div>
        <div class="count" id="appCount" aria-live="polite">01 APP</div>
      </div>

      <div class="app-list" id="appList">
        <a
          class="app-card"
          href="https://vamrss.github.io/memotimer/"
          data-search="memotimer memo timer clipboard メモ タイマー コピー productivity utility"
        >
          <span class="app-index">01</span>
          <span>
            <span class="app-title-row">
              <span class="app-title">MEMOTIMER</span>
              <span class="badge">Utility</span>
            </span>
            <span class="app-description">クリックでコピーできるメモと、残り時間を見せないタイマー。</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>

      <p class="empty" id="emptyState">No applications found.</p>

      <div class="placeholder" aria-hidden="true">
        <span class="app-index">+</span>
        <span>
          <p class="placeholder-title">NEXT APPLICATION</p>
          <p class="placeholder-copy">新しいWebアプリは、この一覧へ追加していきます。</p>
        </span>
      </div>
    </section>

    <footer class="footer">
      <span>HHHUUUBBB</span>
      <span>v0.1.0 / 2026</span>
    </footer>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const themeButton = document.getElementById('themeButton');
      const searchInput = document.getElementById('searchInput');
      const cards = [...document.querySelectorAll('.app-card')];
      const appCount = document.getElementById('appCount');
      const emptyState = document.getElementById('emptyState');
      const themeMeta = document.querySelector('meta[name="theme-color"]');

      const setTheme = (theme) => {
        root.dataset.theme = theme;
        themeButton.textContent = theme === 'dark' ? 'LIGHT' : 'DARK';
        themeButton.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`);
        themeMeta.setAttribute('content', theme === 'dark' ? '#101312' : '#f8f9f9');
        localStorage.setItem('hhh-theme', theme);
      };

      const savedTheme = localStorage.getItem('hhh-theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme || (systemDark ? 'dark' : 'light'));

      themeButton.addEventListener('click', () => {
        setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      const updateFilter = () => {
        const query = searchInput.value.trim().toLowerCase();
        let visible = 0;

        cards.forEach((card) => {
          const haystack = `${card.textContent} ${card.dataset.search || ''}`.toLowerCase();
          const match = !query || haystack.includes(query);
          card.hidden = !match;
          if (match) visible += 1;
        });

        appCount.textContent = `${String(visible).padStart(2, '0')} ${visible === 1 ? 'APP' : 'APPS'}`;
        emptyState.classList.toggle('visible', visible === 0);
      };

      searchInput.addEventListener('input', updateFilter);
    })();
  </script>
</body>
</html>
