<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>HHUUBB</title>
  <meta name="description" content="HHHUUUBBB — VAMRSS web application hub.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button { font: inherit; }

    button,
    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
      position: relative;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 48px;
    }

    .brand-button,
    .text-link,
    .action {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0 2px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.09em;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-button {
      justify-self: start;
      padding-left: 0;
      color: var(--ink);
      letter-spacing: 0.11em;
    }

    .text-link {
      justify-self: end;
      text-transform: uppercase;
    }

    .brand-button:hover,
    .brand-button:focus-visible,
    .text-link:hover,
    .text-link:focus-visible,
    .action:hover,
    .action:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .list {
      display: grid;
      gap: 0;
    }

    .app-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 1em;
      align-items: baseline;
      padding: 1px 0;
    }

    .app-info {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: .7em;
      white-space: nowrap;
      overflow: hidden;
    }

    .app-name {
      flex: 0 0 auto;
      color: var(--ink);
      text-decoration: none;
    }

    .app-name:hover,
    .app-name:focus-visible {
      text-decoration: underline;
      text-underline-offset: 2px;
      outline: none;
    }

    .app-description {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 0 5px;
      justify-content: flex-end;
      align-items: baseline;
      white-space: nowrap;
    }

    .action {
      line-height: 2;
      text-transform: uppercase;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
      color: var(--muted);
      min-height: 1em;
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .app-row { gap: .7em; }
      .app-info { gap: .55em; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="themeButton" class="brand-button" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark theme">HHUUBB</button>
      <a class="text-link" href="https://github.com/VAMRSS/HHHUUUBBB" target="_blank" rel="noopener noreferrer">GITHUB</a>
    </header>

    <h2 class="section-title">WEB APPLICATIONS</h2>

    <section id="appRows" class="list" aria-label="Web applications"></section>

    <footer class="footer">
      <span id="downloadStatus"></span>
    </footer>
  </main>

  <script>
    const APPS = [
      {
        name: 'MEMOTIMER',
        description: 'メモ＋タイマー',
        openUrl: './memotimer.html',
        htmlUrl: './memotimer.html',
        fileName: 'memotimer.html'
      },
      {
        name: 'MICRO BUSINESS BOARD',
        description: '小規模事業の進捗・収支管理',
        openUrl: './micro-business-board-v0.1.html',
        htmlUrl: './micro-business-board-v0.1.html',
        fileName: 'micro-business-board-v0.1.html'
      },
      {
        name: 'YT PLAIN',
        description: 'YouTube検索',
        openUrl: './yt-plain-wsv-v1.2.1.html',
        htmlUrl: './yt-plain-wsv-v1.2.1.html',
        fileName: 'yt-plain-wsv-v1.2.1.html'
      },
      {
        name: 'PDF2JPEG',
        description: 'PDF一括変換',
        openUrl: './pdf-to-jpeg-batch-v6.html',
        htmlUrl: './pdf-to-jpeg-batch-v6.html',
        fileName: 'pdf-to-jpeg-batch-v6.html'
      },
      {
        name: 'WIKIPEDIA PLAIN VIEWER',
        description: 'Wikipedia閲覧',
        openUrl: './wikipedia-plain-viewer.html',
        htmlUrl: './wikipedia-plain-viewer.html',
        fileName: 'wikipedia-plain-viewer.html'
      },
      {
        name: 'MP4 SEAMLESS JOINER',
        description: 'MP4無再エンコード結合',
        openUrl: './mp4-seamless-joiner-v2.html',
        htmlUrl: './mp4-seamless-joiner-v2.html',
        fileName: 'mp4-seamless-joiner-v2.html'
      },
      {
        name: 'IMAGE BATCH EDITOR',
        description: '画像一括編集',
        openUrl: './vamrss_image_batch_editor_web.html',
        htmlUrl: './vamrss_image_batch_editor_web.html',
        fileName: 'vamrss_image_batch_editor_web.html'
      },
      {
        name: 'IMAGE REDACTION UTILITY',
        description: '画像一括黒塗り',
        openUrl: './vamrss_image_redaction_utility_web.html',
        htmlUrl: './vamrss_image_redaction_utility_web.html',
        fileName: 'vamrss_image_redaction_utility_web.html'
      }
    ];

    const root = document.documentElement;
    const themeButton = document.getElementById('themeButton');
    const appRows = document.getElementById('appRows');
    const downloadStatus = document.getElementById('downloadStatus');

    function setTheme(theme) {
      root.dataset.theme = theme;
      localStorage.setItem('hhhuuubbb-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#101312' : '#f8f9f9'
      );
    }

    const savedTheme = localStorage.getItem('hhhuuubbb-theme');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemDark ? 'dark' : 'light'));

    themeButton.addEventListener('click', () => {
      setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    function createRow(app) {
      const row = document.createElement('div');
      row.className = 'app-row';

      const info = document.createElement('span');
      info.className = 'app-info';

      const name = document.createElement('a');
      name.className = 'app-name';
      name.href = app.openUrl;
      name.target = '_blank';
      name.rel = 'noopener noreferrer';
      name.textContent = app.name;

      const description = document.createElement('span');
      description.className = 'app-description';
      description.textContent = app.description;

      info.append(name, description);

      const actions = document.createElement('span');
      actions.className = 'actions';

      const download = document.createElement('button');
      download.className = 'action';
      download.type = 'button';
      download.textContent = 'HTML';
      download.setAttribute('aria-label', `Download ${app.name} HTML`);
      download.addEventListener('click', () => downloadHtml(app));

      actions.append(download);
      row.append(info, actions);
      return row;
    }

    function renderApps() {
      appRows.innerHTML = '';
      APPS.forEach(app => appRows.appendChild(createRow(app)));
    }

    async function downloadHtml(app) {
      downloadStatus.textContent = 'DOWNLOADING…';
      try {
        const response = await fetch(app.htmlUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = app.fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        downloadStatus.textContent = 'DOWNLOADED';
      } catch (error) {
        downloadStatus.textContent = 'DOWNLOAD FAILED';
      }

      window.setTimeout(() => {
        downloadStatus.textContent = '';
      }, 1800);
    }

    renderApps();
  </script>
</body>
</html>
