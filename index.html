<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>HHHUUUBBB</title>
  <meta name="description" content="HHHUUUBBB — VAMRSS web application hub.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --invert-bg: #111714;
      --invert-ink: #f8f9f9;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
      --invert-bg: #edf1ef;
      --invert-ink: #101312;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
      position: relative;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      grid-template-areas: "logo nav";
      align-items: start;
      column-gap: 18px;
      row-gap: 0;
      margin-bottom: 48px;
    }

    .brand {
      grid-area: logo;
      margin: 0;
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.11em;
      white-space: nowrap;
    }

    .text-nav {
      grid-area: nav;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: flex-end;
      flex-wrap: nowrap;
      text-align: right;
      align-self: start;
      justify-self: end;
      padding: 0;
      margin: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .text-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0 2px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .text-button:hover,
    .text-button:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .search-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-wrap {
      min-width: 0;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      min-height: 24px;
      border: 0;
      border-radius: 0;
      background: var(--ink);
      color: var(--bg);
      padding: 2px 8px;
      outline: none;
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      text-align: left;
    }

    #searchInput::placeholder {
      color: var(--bg);
      opacity: 0.88;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .list {
      display: grid;
      gap: 0;
    }

    .list-head,
    .app-row {
      width: 100%;
      display: grid;
      grid-template-columns: 4.5em minmax(0, 1fr) 7.5em;
      gap: 1em;
      align-items: baseline;
      border: 0;
      background: transparent;
      padding: 1px 0;
      text-align: left;
    }

    .list-head {
      color: var(--muted);
    }

    .app-row {
      color: var(--ink);
    }

    .app-name,
    .app-description {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-description {
      color: var(--sub);
    }

    .actions {
      display: flex;
      gap: 0 5px;
      justify-content: flex-start;
      align-items: baseline;
      white-space: nowrap;
    }

    .action {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0 2px;
      color: var(--sub);
      font: inherit;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .action:hover,
    .action:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
    }

    .empty {
      display: none;
      color: var(--muted);
      padding: 1px 0;
    }

    .empty.show { display: block; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      color: var(--muted);
    }

    .download-status {
      text-align: right;
      min-height: 1em;
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .text-nav { gap: 8px; }
      .list-head,
      .app-row {
        grid-template-columns: 4.5em minmax(0, 1fr) 7.5em;
        gap: .7em;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand">HHHUUUBBB</h1>
      <nav class="text-nav" aria-label="Utilities">
        <button id="focusSearch" class="text-button" type="button">SEARCH</button>
        <button id="themeButton" class="text-button" type="button" aria-label="Toggle theme">DARK</button>
      </nav>
    </header>

    <div class="search-line">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="SEARCH APPLICATIONS" autocomplete="off" aria-label="Search applications">
      </div>
      <span id="countLabel" class="count">01</span>
    </div>

    <h2 class="section-title">WEB APPLICATIONS</h2>

    <section class="list" aria-label="Web applications">
      <div class="list-head" aria-hidden="true">
        <span>APP</span>
        <span>DESCRIPTION</span>
        <span>ACTION</span>
      </div>
      <div id="appRows"></div>
    </section>

    <div id="emptyState" class="empty">NO MATCHING APPLICATIONS</div>

    <footer class="footer">
      <span>VAMRSS</span>
      <span id="downloadStatus" class="download-status"></span>
    </footer>
  </main>

  <script>
    const APPS = [
      {
        name: 'MEMOTIMER',
        description: 'Memo / hidden countdown timer',
        openUrl: 'https://vamrss.github.io/memotimer/',
        htmlUrl: 'https://raw.githubusercontent.com/VAMRSS/memotimer/main/index.html',
        fileName: 'memotimer.html'
      }
    ];

    const root = document.documentElement;
    const themeButton = document.getElementById('themeButton');
    const focusSearch = document.getElementById('focusSearch');
    const searchInput = document.getElementById('searchInput');
    const appRows = document.getElementById('appRows');
    const emptyState = document.getElementById('emptyState');
    const countLabel = document.getElementById('countLabel');
    const downloadStatus = document.getElementById('downloadStatus');

    function padCount(value) {
      return String(value).padStart(2, '0');
    }

    function setTheme(theme) {
      root.dataset.theme = theme;
      themeButton.textContent = theme === 'dark' ? 'LIGHT' : 'DARK';
      localStorage.setItem('hhhuuubbb-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#101312' : '#f8f9f9'
      );
    }

    const savedTheme = localStorage.getItem('hhhuuubbb-theme');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemDark ? 'dark' : 'light'));

    themeButton.addEventListener('click', () => {
      setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    focusSearch.addEventListener('click', () => {
      searchInput.focus();
      searchInput.select();
    });

    function createRow(app) {
      const row = document.createElement('div');
      row.className = 'app-row';
      row.dataset.search = `${app.name} ${app.description}`.toLowerCase();

      const name = document.createElement('span');
      name.className = 'app-name';
      name.textContent = app.name;

      const description = document.createElement('span');
      description.className = 'app-description';
      description.textContent = app.description;

      const actions = document.createElement('span');
      actions.className = 'actions';

      const open = document.createElement('a');
      open.className = 'action';
      open.href = app.openUrl;
      open.target = '_blank';
      open.rel = 'noopener noreferrer';
      open.textContent = 'OPEN';

      const download = document.createElement('button');
      download.className = 'action';
      download.type = 'button';
      download.textContent = 'HTML';
      download.setAttribute('aria-label', `Download ${app.name} HTML`);
      download.addEventListener('click', () => downloadHtml(app));

      actions.append(open, download);
      row.append(name, description, actions);
      return row;
    }

    function renderApps() {
      appRows.innerHTML = '';
      APPS.forEach(app => appRows.appendChild(createRow(app)));
      applySearch();
    }

    function applySearch() {
      const query = searchInput.value.trim().toLowerCase();
      const rows = [...appRows.querySelectorAll('.app-row')];
      let visible = 0;

      rows.forEach(row => {
        const show = !query || row.dataset.search.includes(query);
        row.style.display = show ? 'grid' : 'none';
        if (show) visible += 1;
      });

      countLabel.textContent = padCount(visible);
      emptyState.classList.toggle('show', visible === 0);
    }

    async function downloadHtml(app) {
      downloadStatus.textContent = 'DOWNLOADING…';
      try {
        const response = await fetch(app.htmlUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = app.fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        downloadStatus.textContent = 'DOWNLOADED';
      } catch (error) {
        downloadStatus.textContent = 'DOWNLOAD FAILED';
      }

      window.setTimeout(() => {
        downloadStatus.textContent = '';
      }, 1800);
    }

    searchInput.addEventListener('input', applySearch);
    renderApps();
  </script>
</body>
</html>
