<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>VHUB</title>
  <meta name="description" content="VHUB — VAMRSS web application hub.">
  <link rel="icon" href="./favicon.svg?v=20260828-3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button { font: inherit; }

    button,
    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
      position: relative;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 48px;
    }

    .brand-button,
    .text-link,
    .action {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0 2px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.09em;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-button {
      justify-self: start;
      padding-left: 0;
      color: var(--ink);
      font-family: "Rubik Glitch", sans-serif;
      font-size: 40px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
    }

    .text-link {
      justify-self: end;
      display: inline-flex;
      width: 16px;
      height: 16px;
      padding: 0;
      align-items: center;
      justify-content: center;
      opacity: .68;
    }

    .github-icon {
      display: block;
      width: 16px;
      height: 16px;
    }

    html[data-theme="dark"] .github-icon {
      filter: invert(1);
    }

    .brand-button:hover,
    .brand-button:focus-visible,
    .text-link:hover,
    .text-link:focus-visible,
    .action:hover,
    .action:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .text-link:hover,
    .text-link:focus-visible {
      opacity: 1;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .section-spaced {
      margin-top: 32px;
    }

    .list {
      display: grid;
      gap: 0;
    }

    .app-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 1em;
      align-items: baseline;
      padding: 1px 0;
    }

    .app-info {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: .7em;
      white-space: nowrap;
      overflow: hidden;
    }

    .app-name {
      flex: 0 0 auto;
      color: var(--ink);
      text-decoration: none;
    }

    .app-name:hover,
    .app-name:focus-visible {
      text-decoration: underline;
      text-underline-offset: 2px;
      outline: none;
    }

    .app-description {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 0 5px;
      justify-content: flex-end;
      align-items: baseline;
      white-space: nowrap;
    }

    .action {
      line-height: 2;
      text-transform: uppercase;
    }

    .bookmarks {
      display: grid;
      gap: 2px;
      padding: 3px 0;
    }

    .bookmark-group {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: center;
      min-height: 24px;
    }

    .bookmark-category {
      color: var(--muted);
      line-height: 1;
      letter-spacing: 0.09em;
      white-space: nowrap;
    }

    .bookmark-icons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 3px 0;
    }

    .bookmark-link {
      display: inline-flex;
      width: 16px;
      height: 16px;
      align-items: center;
      justify-content: center;
      opacity: .68;
      text-decoration: none;
      transition: opacity 120ms ease;
    }

    .bookmark-link:hover,
    .bookmark-link:focus-visible {
      opacity: 1;
      outline: none;
    }

    .bookmark-icon {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .bookmark-link.fluent-icon-frame {
      background: #fff;
      border-radius: 4px;
      opacity: 1;
    }

    .bookmark-link.fluent-icon-frame .bookmark-icon {
      width: 14px;
      height: 14px;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
      color: var(--muted);
      min-height: 1em;
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .app-row { gap: .7em; }
      .app-info { gap: .55em; }
      .bookmark-group { grid-template-columns: 84px minmax(0, 1fr); }
      .bookmark-icons { gap: 9px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="themeButton" class="brand-button" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark theme">VHUB</button>
      <a class="text-link" href="https://github.com/VAMRSS/VHUB" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <img class="github-icon" src="https://github.com/favicon.ico" alt="">
      </a>
    </header>

    <h2 class="section-title">WEB APPLICATIONS</h2>
    <section id="appRows" class="list" aria-label="Web applications"></section>

    <h2 class="section-title section-spaced">BOOKMARKS</h2>
    <section id="bookmarkRows" class="bookmarks" aria-label="Bookmarks"></section>

    <footer class="footer">
      <span id="downloadStatus"></span>
    </footer>
  </main>

  <script src="./bookmarks-data.js?v=20260828-3"></script>
  <script>
    const APPS = [
      { name: 'MEMOTIMER', description: 'メモ＋タイマー', openUrl: './memotimer.html', htmlUrl: './memotimer.html', fileName: 'memotimer.html' },
      { name: 'MICRO BUSINESS BOARD', description: '小規模事業の進捗・収支管理', openUrl: './micro-business-board-v0.1.html', htmlUrl: './micro-business-board-v0.1.html', fileName: 'micro-business-board-v0.1.html' },
      { name: 'YT PLAIN', description: 'YouTube検索', openUrl: './yt-plain-wsv-v1.2.1.html', htmlUrl: './yt-plain-wsv-v1.2.1.html', fileName: 'yt-plain-wsv-v1.2.1.html' },
      { name: 'PDF2JPEG', description: 'PDF一括変換', openUrl: './pdf-to-jpeg-batch-v7-text-flat.html', htmlUrl: './pdf-to-jpeg-batch-v7-text-flat.html', fileName: 'pdf-to-jpeg-batch-v7-text-flat.html' },
      { name: 'WIKIPEDIA PLAIN VIEWER', description: 'Wikipedia閲覧', openUrl: './wikipedia-plain-viewer.html', htmlUrl: './wikipedia-plain-viewer.html', fileName: 'wikipedia-plain-viewer.html' },
      { name: 'MP4 SEAMLESS JOINER', description: 'MP4無再エンコード結合', openUrl: './mp4-seamless-joiner-v2.html', htmlUrl: './mp4-seamless-joiner-v2.html', fileName: 'mp4-seamless-joiner-v2.html' },
      { name: 'IMAGE BATCH EDITOR', description: '画像一括編集', openUrl: './vamrss_image_batch_editor_web.html', htmlUrl: './vamrss_image_batch_editor_web.html', fileName: 'vamrss_image_batch_editor_web.html' },
      { name: 'IMAGE REDACTION UTILITY', description: '画像一括黒塗り', openUrl: './vamrss_image_redaction_utility_web.html', htmlUrl: './vamrss_image_redaction_utility_web.html', fileName: 'vamrss_image_redaction_utility_web.html' }
    ];

    const EXTRA_BOOKMARKS = [
      { href: 'https://mag.tecture.jp/', icon: 'https://www.google.com/s2/favicons?domain=mag.tecture.jp&sz=32', label: 'TECTURE MAG' },
      { href: 'https://www.jma.go.jp/bosai/nowc/#zoom:14/lat:35.666222/lon:139.783945/colordepth:normal/elements:slmcs&hrpns', icon: './fluent-weather.svg?v=20260901-1', label: '気象庁 雨雲の動き', iconStyle: 'fluent' },
      { href: 'https://typhoon.yahoo.co.jp/weather/jp/earthquake/kyoshin/', icon: './fluent-earthquake.svg?v=20260901-1', label: 'Yahoo! 強震モニタ', iconStyle: 'fluent' },
      { href: 'https://weathernews.jp/onebox/tenki/tokyo/13120/', icon: 'https://www.google.com/s2/favicons?domain=weathernews.jp&sz=32', label: 'Weathernews' },
      { href: 'https://www.google.com/maps', icon: 'https://www.google.com/s2/favicons?domain=maps.google.com&sz=32', label: 'Google Maps' },
      { href: 'https://platform.openai.com/home', icon: 'https://www.google.com/s2/favicons?domain=platform.openai.com&sz=32', label: 'OpenAI Platform' },
      { href: 'https://outlook.cloud.microsoft/mail/', icon: './outlook-mail.svg?v=20260901-1', label: 'Outlook Mail', iconStyle: 'fluent' },
      { href: 'https://outlook.cloud.microsoft/calendar/', icon: './outlook-calendar.svg?v=20260901-1', label: 'Outlook Calendar', iconStyle: 'fluent' }
    ];

    const BOOKMARK_CATEGORY_ORDER = [
      'WORK',
      'AI',
      'TRANSIT',
      'WEATHER',
      'TOOLS',
      'MEDIA',
      'LIFESTYLE',
      'OTHER'
    ];

    const root = document.documentElement;
    const themeButton = document.getElementById('themeButton');
    const appRows = document.getElementById('appRows');
    const bookmarkRows = document.getElementById('bookmarkRows');
    const downloadStatus = document.getElementById('downloadStatus');

    function setTheme(theme) {
      root.dataset.theme = theme;
      localStorage.setItem('vhub-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#101312' : '#f8f9f9'
      );
    }

    const savedTheme = localStorage.getItem('vhub-theme');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemDark ? 'dark' : 'light'));

    themeButton.addEventListener('click', () => {
      setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    function createRow(app) {
      const row = document.createElement('div');
      row.className = 'app-row';

      const info = document.createElement('span');
      info.className = 'app-info';

      const name = document.createElement('a');
      name.className = 'app-name';
      name.href = app.openUrl;
      name.target = '_blank';
      name.rel = 'noopener noreferrer';
      name.textContent = app.name;

      const description = document.createElement('span');
      description.className = 'app-description';
      description.textContent = app.description;

      info.append(name, description);

      const actions = document.createElement('span');
      actions.className = 'actions';

      const download = document.createElement('button');
      download.className = 'action';
      download.type = 'button';
      download.textContent = 'HTML';
      download.setAttribute('aria-label', `Download ${app.name} HTML`);
      download.addEventListener('click', () => downloadHtml(app));

      actions.append(download);
      row.append(info, actions);
      return row;
    }

    function renderApps() {
      appRows.innerHTML = '';
      APPS.forEach(app => appRows.appendChild(createRow(app)));
    }

    function getBookmarkCategory(bookmark) {
      const href = bookmark.href.toLowerCase();

      if (
        href.includes('infroneer.app.lumapps.com') ||
        href.includes('wowtalkapi.com') ||
        href.includes('forms.office.com') ||
        href.includes('smcon.app.box.com') ||
        href.includes('app.colorkrewbiz.com') ||
        href.includes('engage.cloud.microsoft') ||
        href.includes('outlook.cloud.microsoft')
      ) return 'WORK';

      if (
        href.includes('claude.ai') ||
        href.includes('gemini.google.com') ||
        href.includes('chatgpt.com') ||
        href.includes('platform.openai.com') ||
        href.includes('d3ul3fhsq70saq.cloudfront.net')
      ) return 'AI';

      if (
        href.includes('jma.go.jp/bosai/nowc') ||
        href.includes('typhoon.yahoo.co.jp/weather/jp/earthquake/kyoshin') ||
        href.includes('weathernews.jp/onebox/tenki')
      ) return 'WEATHER';

      if (
        href.includes('highwaybus.com') ||
        href.includes('transit.yahoo.co.jp') ||
        href.includes('eki-net.com') ||
        href.includes('google.com/maps') ||
        href.includes('maps.google.com')
      ) return 'TRANSIT';

      if (
        href.includes('vamrss.github.io/vhub') ||
        href.includes('keep.google.com')
      ) return 'TOOLS';

      if (href.includes('mag.tecture.jp')) return 'MEDIA';

      if (
        href.includes('partner.sapporobeer.jp') ||
        href.includes('asahibeer.co.jp')
      ) return 'LIFESTYLE';

      return 'OTHER';
    }

    function createBookmarkLink(bookmark, suffix = '') {
      const link = document.createElement('a');
      link.className = 'bookmark-link';
      if (bookmark.iconStyle === 'fluent') link.classList.add('fluent-icon-frame');
      link.href = bookmark.href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = suffix ? `${bookmark.label} · ${suffix}` : bookmark.label;
      link.setAttribute('aria-label', suffix ? `${bookmark.label}, ${suffix}` : bookmark.label);

      const icon = document.createElement('img');
      icon.className = 'bookmark-icon';
      icon.src = bookmark.icon === './favicon.svg'
        ? './favicon.svg?v=20260828-3'
        : bookmark.icon;
      icon.alt = '';
      icon.width = 16;
      icon.height = 16;

      link.append(icon);
      return link;
    }

    function renderBookmarks() {
      bookmarkRows.innerHTML = '';

      const baseBookmarks = Array.isArray(window.HHUB_BOOKMARKS)
        ? window.HHUB_BOOKMARKS
        : [];

      const bookmarks = [...baseBookmarks, ...EXTRA_BOOKMARKS].map(bookmark => ({
        ...bookmark,
        category: getBookmarkCategory(bookmark)
      }));

      BOOKMARK_CATEGORY_ORDER.forEach(category => {
        const items = bookmarks.filter(bookmark => bookmark.category === category);
        if (!items.length) return;

        const group = document.createElement('div');
        group.className = 'bookmark-group';

        const categoryLabel = document.createElement('span');
        categoryLabel.className = 'bookmark-category';
        categoryLabel.textContent = category;

        const icons = document.createElement('span');
        icons.className = 'bookmark-icons';

        items.forEach(bookmark => icons.append(createBookmarkLink(bookmark, category)));

        group.append(categoryLabel, icons);
        bookmarkRows.append(group);
      });
    }

    async function downloadHtml(app) {
      downloadStatus.textContent = 'DOWNLOADING…';
      try {
        const response = await fetch(app.htmlUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = app.fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        downloadStatus.textContent = 'DOWNLOADED';
      } catch (error) {
        downloadStatus.textContent = 'DOWNLOAD FAILED';
      }

      window.setTimeout(() => {
        downloadStatus.textContent = '';
      }, 1800);
    }

    renderApps();
    renderBookmarks();
  </script>
</body>
</html>
