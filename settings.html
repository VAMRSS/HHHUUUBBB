<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>VHUB</title>
  <meta name="description" content="VHUB settings.">
  <link rel="icon" href="./favicon.svg?v=20260828-3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button,
    a {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 48px;
    }

    .brand {
      justify-self: start;
      color: var(--ink);
      font-family: "Rubik Glitch", sans-serif;
      font-size: 40px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding-top: 2px;
    }

    .text-link,
    .choice {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.09em;
      text-decoration: none;
      cursor: pointer;
    }

    .text-link:hover,
    .text-link:focus-visible,
    .choice:hover,
    .choice:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: baseline;
      min-height: 28px;
      padding: 2px 0;
    }

    .setting-label {
      color: var(--muted);
      letter-spacing: 0.09em;
    }

    .setting-control {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    .choice[aria-pressed="true"] {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .note {
      margin: 22px 0 0 92px;
      color: var(--muted);
      line-height: 1.8;
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .nav-links { gap: 10px; }
      .setting-row { grid-template-columns: 84px minmax(0, 1fr); }
      .note { margin-left: 84px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="VHUB home">VHUB</a>
      <nav class="nav-links" aria-label="VHUB navigation">
        <a class="text-link" href="./index.html">HOME</a>
        <a class="text-link" href="https://github.com/VAMRSS/VHUB" target="_blank" rel="noopener noreferrer">GITHUB</a>
      </nav>
    </header>

    <h1 class="section-title">SETTINGS</h1>

    <section aria-label="Appearance settings">
      <div class="setting-row">
        <span class="setting-label">THEME</span>
        <span class="setting-control">
          <button id="lightButton" class="choice" type="button" aria-pressed="false">LIGHT</button>
          <button id="darkButton" class="choice" type="button" aria-pressed="false">DARK</button>
        </span>
      </div>
    </section>

    <p class="note">VHUBの設定項目は今後このページに集約します。</p>
  </main>

  <script>
    const root = document.documentElement;
    const lightButton = document.getElementById('lightButton');
    const darkButton = document.getElementById('darkButton');

    function setTheme(theme) {
      root.dataset.theme = theme;
      localStorage.setItem('vhub-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute(
        'content',
        theme === 'dark' ? '#101312' : '#f8f9f9'
      );
      lightButton.setAttribute('aria-pressed', String(theme === 'light'));
      darkButton.setAttribute('aria-pressed', String(theme === 'dark'));
    }

    const savedTheme = localStorage.getItem('vhub-theme');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (systemDark ? 'dark' : 'light'));

    lightButton.addEventListener('click', () => setTheme('light'));
    darkButton.addEventListener('click', () => setTheme('dark'));
  </script>
</body>
</html>
