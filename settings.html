<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>VHUB</title>
  <meta name="description" content="VHUB settings.">
  <link rel="icon" href="./favicon.svg?v=20260828-3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button,
    a {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 48px;
    }

    .brand {
      justify-self: start;
      color: var(--ink);
      font-family: "Rubik Glitch", sans-serif;
      font-size: 40px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding-top: 2px;
    }

    .text-link,
    .theme-choice {
      appearance: none;
      border: 0;
      background: transparent;
      margin: 0;
      padding: 0;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      text-decoration: none;
      cursor: pointer;
    }

    .text-link {
      line-height: 1;
      letter-spacing: 0.09em;
    }

    .text-link:hover,
    .text-link:focus-visible,
    .theme-choice:hover,
    .theme-choice:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: start;
      min-height: 28px;
      padding: 2px 0;
    }

    .setting-label {
      color: var(--muted);
      letter-spacing: 0.09em;
      line-height: 24px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px 16px;
      min-width: 0;
    }

    .theme-choice {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-align: left;
      line-height: 24px;
      letter-spacing: 0.06em;
    }

    .theme-swatch {
      position: relative;
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background: var(--swatch-bg);
      box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .3);
      overflow: hidden;
    }

    .theme-swatch::before,
    .theme-swatch::after {
      content: '';
      position: absolute;
      left: 4px;
      border-radius: 1px;
    }

    .theme-swatch::before {
      top: 5px;
      width: 8px;
      height: 2px;
      background: var(--swatch-ink);
    }

    .theme-swatch::after {
      top: 9px;
      width: 6px;
      height: 1px;
      background: var(--swatch-sub);
    }

    .theme-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .theme-choice[aria-pressed="true"] .theme-name {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .note {
      margin: 22px 0 0 92px;
      color: var(--muted);
      line-height: 1.8;
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .nav-links { gap: 10px; }
      .setting-row { grid-template-columns: 84px minmax(0, 1fr); }
      .theme-options { grid-template-columns: 1fr; gap: 2px; }
      .note { margin-left: 84px; }
    }
  </style>
  <script src="./vhub-theme.js?v=20260903-1"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="VHUB home">VHUB</a>
      <nav class="nav-links" aria-label="VHUB navigation">
        <a class="text-link" href="./index.html">HOME</a>
        <a class="text-link" href="https://github.com/VAMRSS/VHUB" target="_blank" rel="noopener noreferrer">GITHUB</a>
      </nav>
    </header>

    <h1 class="section-title">SETTINGS</h1>

    <section aria-label="Appearance settings">
      <div class="setting-row">
        <span class="setting-label">THEME</span>
        <div id="themeOptions" class="theme-options"></div>
      </div>
    </section>

    <p class="note">18 THEMES · 選択したテーマはこのブラウザに保存され、HOMEにも反映されます。</p>
  </main>

  <script>
    const themeOptions = document.getElementById('themeOptions');

    function syncSelection(themeId) {
      themeOptions.querySelectorAll('.theme-choice').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === themeId));
      });
    }

    function setTheme(themeId) {
      const theme = window.VHUBTheme.apply(themeId);
      syncSelection(theme.id);
    }

    window.VHUBTheme.themes.forEach(theme => {
      const button = document.createElement('button');
      button.className = 'theme-choice';
      button.type = 'button';
      button.dataset.theme = theme.id;
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', `${theme.label} theme`);
      button.style.setProperty('--swatch-bg', theme.bg);
      button.style.setProperty('--swatch-ink', theme.ink);
      button.style.setProperty('--swatch-sub', theme.sub);

      const swatch = document.createElement('span');
      swatch.className = 'theme-swatch';
      swatch.setAttribute('aria-hidden', 'true');

      const label = document.createElement('span');
      label.className = 'theme-name';
      label.textContent = theme.label;

      button.append(swatch, label);
      button.addEventListener('click', () => setTheme(theme.id));
      themeOptions.append(button);
    });

    syncSelection(document.documentElement.dataset.theme);
  </script>
</body>
</html>
