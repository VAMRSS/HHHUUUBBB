<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f9">
  <title>VHUB</title>
  <meta name="description" content="VHUB settings.">
  <link rel="icon" href="./favicon.svg?v=20260828-3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button,
    a {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(48px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: 18px;
      margin-bottom: 48px;
    }

    .brand {
      justify-self: start;
      color: var(--ink);
      font-family: "Rubik Glitch", sans-serif;
      font-size: 40px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding-top: 2px;
    }

    .text-link,
    .theme-choice {
      appearance: none;
      border: 0;
      margin: 0;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      text-decoration: none;
      cursor: pointer;
    }

    .text-link {
      padding: 0;
      background: transparent;
      line-height: 1;
      letter-spacing: 0.09em;
    }

    .text-link:hover,
    .text-link:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .section-title {
      margin: 16px 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .intro {
      margin: 0 0 26px;
      color: var(--sub);
      line-height: 1.7;
      max-width: 560px;
    }

    .theme-group {
      margin-top: 28px;
    }

    .theme-group:first-of-type {
      margin-top: 0;
    }

    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 7px;
    }

    .group-name {
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .group-count {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .theme-choice {
      display: grid;
      grid-template-rows: 72px auto;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      text-align: left;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      border-radius: 10px;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .theme-choice:hover,
    .theme-choice:focus-visible {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--ink) 32%, transparent);
      outline: none;
    }

    .theme-choice[aria-pressed="true"] {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .theme-preview {
      position: relative;
      overflow: hidden;
      background: var(--preview-scene);
    }

    .theme-preview::before,
    .theme-preview::after {
      content: '';
      position: absolute;
      left: 12px;
      right: 12px;
      border-radius: 3px;
      background: var(--preview-ink);
      opacity: .82;
    }

    .theme-preview::before {
      top: 18px;
      height: 5px;
      width: 42%;
      right: auto;
    }

    .theme-preview::after {
      top: 31px;
      height: 3px;
      width: 64%;
      right: auto;
      background: var(--preview-sub);
    }

    .preview-dot {
      position: absolute;
      right: 12px;
      top: 15px;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--preview-accent);
    }

    .preview-row {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 12px;
      border: 1px solid color-mix(in srgb, var(--preview-ink) 18%, transparent);
      border-radius: var(--preview-radius, 2px);
      background: color-mix(in srgb, var(--preview-bg) 72%, transparent);
    }

    .theme-choice[data-layout="brutal"] .preview-row { border-width: 2px; border-color: var(--preview-ink); border-radius: 0; }
    .theme-choice[data-layout="glass"] .preview-row { background: rgba(255,255,255,.28); border-color: rgba(255,255,255,.5); border-radius: 7px; }
    .theme-choice[data-layout="bento"] .preview-row { height: 20px; border-radius: 7px; }
    .theme-choice[data-layout="terminal"] .theme-preview::before,
    .theme-choice[data-layout="terminal"] .theme-preview::after { border-radius: 0; }
    .theme-choice[data-effect="grid"] .theme-preview {
      background-image:
        linear-gradient(color-mix(in srgb, var(--preview-accent) 24%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--preview-accent) 24%, transparent) 1px, transparent 1px),
        var(--preview-scene);
      background-size: 12px 12px, 12px 12px, auto;
    }

    .theme-info {
      padding: 8px 10px 9px;
      min-width: 0;
    }

    .theme-name {
      display: block;
      color: var(--ink);
      line-height: 1.35;
      letter-spacing: .06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: .08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note {
      margin: 30px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    @media (max-width: 620px) {
      .theme-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .topbar { column-gap: 12px; }
      .nav-links { gap: 10px; }
      .theme-options { grid-template-columns: 1fr; }
      .theme-choice { grid-template-rows: 64px auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-choice { transition: none; }
    }
  </style>
  <script src="./vhub-theme.js?v=20260903-2"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="VHUB home">VHUB</a>
      <nav class="nav-links" aria-label="VHUB navigation">
        <a class="text-link" href="./index.html">HOME</a>
        <a class="text-link" href="https://github.com/VAMRSS/VHUB" target="_blank" rel="noopener noreferrer">GITHUB</a>
      </nav>
    </header>

    <h1 class="section-title">SETTINGS / STYLE</h1>
    <p id="styleCount" class="intro"></p>
    <section id="themeGroups" aria-label="VHUB styles"></section>
    <p class="note">配色だけでなく、背景・動き・レイアウトまで含めて保存されます。動きはOSの「視差効果を減らす」設定にも対応します。</p>
  </main>

  <script>
    const themeGroups = document.getElementById('themeGroups');
    const styleCount = document.getElementById('styleCount');
    const groupOrder = ['SOLID', 'GRADIENT', 'MOTION', 'LAYOUT', 'EXPERIMENTAL'];

    styleCount.textContent = `${window.VHUBTheme.themes.length} STYLES · 色、グラデーション、モーション、ページ形式をまとめて切り替えます。`;

    function syncSelection(themeId) {
      themeGroups.querySelectorAll('.theme-choice').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === themeId));
      });
    }

    function setTheme(themeId) {
      const theme = window.VHUBTheme.apply(themeId);
      syncSelection(theme.id);
    }

    groupOrder.forEach(group => {
      const groupThemes = window.VHUBTheme.themes.filter(theme => theme.group === group);
      if (!groupThemes.length) return;

      const section = document.createElement('section');
      section.className = 'theme-group';

      const head = document.createElement('div');
      head.className = 'group-head';

      const name = document.createElement('span');
      name.className = 'group-name';
      name.textContent = group;

      const count = document.createElement('span');
      count.className = 'group-count';
      count.textContent = `${groupThemes.length} STYLES`;

      head.append(name, count);

      const options = document.createElement('div');
      options.className = 'theme-options';

      groupThemes.forEach(theme => {
        const button = document.createElement('button');
        button.className = 'theme-choice';
        button.type = 'button';
        button.dataset.theme = theme.id;
        button.dataset.layout = theme.layout || 'classic';
        button.dataset.effect = theme.effect || 'none';
        button.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-label', `${theme.label} style`);

        button.style.setProperty('--preview-scene', theme.scene || theme.bg);
        button.style.setProperty('--preview-bg', theme.bg);
        button.style.setProperty('--preview-ink', theme.ink);
        button.style.setProperty('--preview-sub', theme.sub);
        button.style.setProperty('--preview-accent', theme.accent || theme.ink);

        const preview = document.createElement('span');
        preview.className = 'theme-preview';
        preview.setAttribute('aria-hidden', 'true');

        const dot = document.createElement('span');
        dot.className = 'preview-dot';

        const row = document.createElement('span');
        row.className = 'preview-row';

        preview.append(dot, row);

        const info = document.createElement('span');
        info.className = 'theme-info';

        const label = document.createElement('span');
        label.className = 'theme-name';
        label.textContent = theme.label;

        const meta = document.createElement('span');
        meta.className = 'theme-meta';
        const traits = [];
        if ((theme.layout || 'classic') !== 'classic') traits.push((theme.layout || '').toUpperCase());
        if ((theme.effect || 'none') !== 'none') traits.push((theme.effect || '').toUpperCase());
        meta.textContent = traits.length ? traits.join(' · ') : 'COLOR';

        info.append(label, meta);
        button.append(preview, info);
        button.addEventListener('click', () => setTheme(theme.id));
        options.append(button);
      });

      section.append(head, options);
      themeGroups.append(section);
    });

    syncSelection(document.documentElement.dataset.theme);
  </script>
</body>
</html>
